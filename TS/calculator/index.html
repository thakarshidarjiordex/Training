<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f2f2f2;

            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;

            padding: 20px;

            background: #222;

            border-radius: 15px;
        }

        #display {
            width: 100%;
            height: 70px;

            margin-bottom: 15px;

            padding: 10px;

            font-size: 30px;
            text-align: right;

            border: none;
            border-radius: 10px;

            background: white;
        }

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;
        }

        button {
            height: 60px;

            font-size: 22px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .number {
            background: #eee;
        }

        .operator {
            background: #ff9500;
            color: white;
        }

        .clear {
            background: #e74c3c;
            color: white;
        }

        .equal {
            background: #2ecc71;
            color: white;

            grid-row: span 2;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input
            type="text"
            id="display"
            readonly
        >

        <div class="buttons">

            <button class="clear" id="clear">C</button>
            <button class="operator" data-value="/">÷</button>
            <button class="operator" data-value="*">×</button>
            <button class="operator" data-value="-">−</button>

            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-value="+">+</button>

            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="equal" id="equal">=</button>

            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>

            <button class="number zero" data-value="0">0</button>
            <button class="number" data-value=".">.</button>

        </div>

    </div>

    <script src="dist/calculator.js"></script>

</body>
</html>
