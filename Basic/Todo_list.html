<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple To-Do</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f9f9f9; }
    div { width: 300px; background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input { width: 68%; padding: 8px; }
    button { padding: 8px; cursor: pointer; }
    ul { padding-left: 20px; }
    li { margin: 8px 0; cursor: pointer; }
    .done { text-decoration: line-through; color: #aaa; }
    .del { float: right; background: #ff4d4d; color: #fff; border: none; font-size: 10px; padding: 3px 6px; }
  </style>
</head>
<body>
  <div>
    <h3>To-Do List</h3>
    <input type="text" id="box" placeholder="New task...">
    <button onclick="add()">Add</button>
    <ul id="list"></ul>
  </div>

  <script>
    const box = document.getElementById('box'), list = document.getElementById('list');
    
    function add() {
      if (!box.value.trim()) return;
      const li = document.createElement('li');
      li.innerHTML = `${box.value} <button class="del" onclick="this.parentElement.remove()">X</button>`;
      li.onclick = (e) => { if(e.target.tagName !== 'BUTTON') li.classList.toggle('done'); };
      list.appendChild(li);
      box.value = '';
    }

    box.onkeydown = (e) => { if (e.key === 'Enter') add(); };
  </script>
</body>
</html>
